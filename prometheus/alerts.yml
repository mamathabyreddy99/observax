groups:
  - name: observax
    rules:
      - alert: ServiceDown
        expr: up{job="observax-services"} == 0
        for: 15s
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.instance }} is down"

      - alert: HighErrorRate
        expr: |
          100 * sum by (service) (rate(http_requests_total{status=~"5.."}[1m]))
              / sum by (service) (rate(http_requests_total[1m])) > 5
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.service }} error rate is {{ $value | printf \"%.1f\" }}%"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le, service) (rate(http_request_duration_seconds_bucket[1m]))) > 0.5
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.service }} p95 latency is {{ $value | printf \"%.2f\" }}s"
